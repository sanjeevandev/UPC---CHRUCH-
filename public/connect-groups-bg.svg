<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Cinematic Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="40%" stop-color="#14141e" />
      <stop offset="75%" stop-color="#1f1412" />
      <stop offset="100%" stop-color="#0d0d12" />
    </linearGradient>

    <!-- Warm Terracotta Light Beam -->
    <radialGradient id="stageLight1" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#dd5234" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#b1422a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Warm Ambient Glow -->
    <radialGradient id="stageLight2" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="stageLight3" cx="80%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#9f1239" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Stage Lights -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#dd5234" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beam2" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#dd5234" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Stage Glows -->
  <rect width="1920" height="1080" fill="url(#stageLight1)" />
  <rect width="1920" height="1080" fill="url(#stageLight2)" />
  <rect width="1920" height="1080" fill="url(#stageLight3)" />

  <!-- Atmospheric Light Beams from Top -->
  <polygon points="960,0 400,1080 650,1080" fill="url(#beam1)" />
  <polygon points="960,0 1270,1080 1520,1080" fill="url(#beam2)" />
  <polygon points="480,0 0,1080 200,1080" fill="url(#beam1)" opacity="0.6" />
  <polygon points="1440,0 1720,1080 1920,1080" fill="url(#beam2)" opacity="0.6" />

  <!-- Architectural Sanctuary Cathedral Arches Silhouette -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" fill="none">
    <path d="M 960,150 C 700,300 600,600 600,1080" />
    <path d="M 960,150 C 1220,300 1320,600 1320,1080" />
    <path d="M 960,250 C 780,380 700,650 700,1080" />
    <path d="M 960,250 C 1140,380 1220,650 1220,1080" />
    <path d="M 960,350 C 840,460 780,700 780,1080" />
    <path d="M 960,350 C 1080,460 1140,700 1140,1080" />
  </g>

  <!-- Central Subtle Cross Silhouette -->
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="955" y="220" width="10" height="320" rx="5" />
    <rect x="880" y="300" width="160" height="10" rx="5" />
  </g>

  <!-- Warm Bokeh Particles / Community Circles -->
  <g fill="#fbbf24" fill-opacity="0.15">
    <circle cx="320" cy="480" r="140" filter="blur(30px)" />
    <circle cx="1600" cy="520" r="160" filter="blur(35px)" />
    <circle cx="960" cy="700" r="180" filter="blur(40px)" fill="#dd5234" fill-opacity="0.18" />
  </g>

  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="450" cy="380" r="4" />
    <circle cx="580" cy="290" r="2.5" />
    <circle cx="720" cy="420" r="3" />
    <circle cx="890" cy="240" r="3.5" />
    <circle cx="1040" cy="310" r="2.5" />
    <circle cx="1210" cy="260" r="4" />
    <circle cx="1380" cy="410" r="3" />
    <circle cx="1510" cy="340" r="3.5" />
    <circle cx="820" cy="580" r="2.5" />
    <circle cx="1100" cy="620" r="3" />
  </g>

  <!-- Bottom Vignette -->
  <rect y="800" width="1920" height="280" fill="url(#bgGrad)" opacity="0.8" />
</svg>
